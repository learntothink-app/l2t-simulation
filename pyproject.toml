[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l2t_sim"
version = "0.2.0"
description = "Simulation harness for the LearnToThink (L2T) paper, §VII protocol."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["l2t_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
