# medium.yaml — primary production run (§VII.B of the paper).
n_students: 1000
t_steps: 100
master_seed: 42
method_seed: 1
n_bootstrap: 10000

behaviour_proportions:
  honest: 0.60
  guesser: 0.15
  copier: 0.10
  help_seeker: 0.15

retention_intervals_days: [1, 3, 7, 14]
forgetting_lambda: 0.05

# Fraction of simulated students whose true prerequisite DAG differs from the
# model-known one (model-reality mismatch in §VII.A).
prereq_perturbation_eps: 0.10

# JoinMode for the simulation runner.
n_jobs: -1
