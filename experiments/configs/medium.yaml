# medium.yaml — primary production run (§VII.B of the paper).
n_students: 1000
t_steps: 100
master_seed: 42
method_seed: 1
n_bootstrap: 10000

# v0.2.0 — synthetic is averaged over K=30 random graph topologies so
# headline synthetic numbers are not n=1 samples in topology space.
# Each graph runs N=n_students students; total 30 * 1000 = 30000
# synthetic trajectories per policy. Probability methodology is real
# and unchanged.
synthetic_ensemble_k: 30

behaviour_proportions:
  honest: 0.60
  guesser: 0.15
  copier: 0.10
  help_seeker: 0.15

retention_intervals_days: [1, 3, 7, 14]
forgetting_lambda: 0.05

# Fraction of simulated students whose true prerequisite DAG differs from the
# model-known one (model-reality mismatch in §VII.A).
prereq_perturbation_eps: 0.10

# JoinMode for the simulation runner.
n_jobs: -1
